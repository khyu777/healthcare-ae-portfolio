version: 2

models:
  - name: int_hospital_quality_scores
    columns:
      - name: hospital_id
        tests:
          - not_null
      - name: measure_id
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - hospital_id
              - measure_id